name: build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Least-privilege: only repo contents read is needed. The debug APK is uploaded to
# the workflow artifact store (not repo contents), so no id-token/packages/actions:write.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Run unit tests
        run: ./gradlew test --no-daemon

      # Fork PRs never receive repository secrets. Use the normal ephemeral debug key
      # there; trusted CI must fail closed if stable signing credentials are missing.
      - name: Configure test signing when available
        shell: bash
        env:
          TEST_SIGNING_KEYSTORE_BASE64: ${{ secrets.TEST_SIGNING_KEYSTORE_BASE64 }}
          TEST_SIGNING_KEYSTORE_PASSWORD: ${{ secrets.TEST_SIGNING_KEYSTORE_PASSWORD }}
          EVENT_NAME: ${{ github.event_name }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          BASE_REPO: ${{ github.repository }}
        run: |
          if [[ -z "$TEST_SIGNING_KEYSTORE_BASE64" || -z "$TEST_SIGNING_KEYSTORE_PASSWORD" ]]; then
            if [[ "$EVENT_NAME" == "pull_request" && "$HEAD_REPO" != "$BASE_REPO" ]]; then
              echo "::notice::Fork PR uses an ephemeral debug signing key; its APK cannot upgrade the official test build in place"
              echo "TEST_SIGNING_MODE=fork-ephemeral" >> "$GITHUB_ENV"
              exit 0
            fi
            echo "::error::Stable test signing secrets missing on trusted CI"
            exit 1
          fi
          printf '%s' "$TEST_SIGNING_KEYSTORE_BASE64" |
            base64 --decode > "$RUNNER_TEMP/nexus-test-signing.p12"
          test -s "$RUNNER_TEMP/nexus-test-signing.p12"
          chmod 600 "$RUNNER_TEMP/nexus-test-signing.p12"
          echo "TEST_SIGNING_KEYSTORE=$RUNNER_TEMP/nexus-test-signing.p12" >> "$GITHUB_ENV"
          echo "TEST_SIGNING_MODE=stable" >> "$GITHUB_ENV"

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon
        env:
          GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          POSTHOG_PROJECT_TOKEN: ${{ secrets.POSTHOG_PROJECT_TOKEN }}
          POSTHOG_HOST: https://us.i.posthog.com
          TEST_SIGNING_KEYSTORE_PASSWORD: ${{ secrets.TEST_SIGNING_KEYSTORE_PASSWORD }}
          TEST_SIGNING_KEY_ALIAS: nexustest
          TEST_SIGNING_KEY_PASSWORD: ${{ secrets.TEST_SIGNING_KEYSTORE_PASSWORD }}

      - name: Print APK signing certificate
        shell: bash
        run: |
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -name apksigner 2>/dev/null | sort | tail -1)"
          if [ -n "$APKSIGNER" ]; then
            "$APKSIGNER" verify --print-certs app/build/outputs/apk/debug/app-debug.apk
          else
            echo "apksigner not found; skipping cert print"
          fi

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          # Distinguish a one-off fork build from an upgradeable stable-test APK.
          name: ${{ env.TEST_SIGNING_MODE == 'stable' && 'nexus-agent-debug-apk' || 'nexus-agent-fork-debug-apk-ephemeral-key' }}
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

  instrumentation-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Enable KVM for emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name=kvm

      - name: Run instrumentation tests on emulator
        uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: default
          script: ./gradlew connectedDebugAndroidTest --no-daemon

      - name: Upload instrumentation test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: instrumentation-test-report
          path: |
            app/build/reports/androidTests/connected/
            app/build/outputs/androidTest-results/connected/
          if-no-files-found: ignore
          retention-days: 14

  # Neon backend (Python/FastAPI) — unit + endpoint tests. Independent of the Android build.
  backend-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install backend dependencies
        run: |
          cd backend
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Run backend tests
        run: |
          cd backend
          pytest -m "not integration" -q

  # Backend integration/parity tests against a disposable PostgreSQL (no Neon access needed).
  backend-integration-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install backend dependencies
        run: |
          cd backend
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Start disposable PostgreSQL
        run: |
          cd backend
          docker compose -f docker-compose.test.yml up -d --wait --wait-timeout 120

      - name: Run integration tests
        env:
          NEON_READ_URL: postgresql://nexus_reader:readerpass@localhost:5432/second_brain
          NEON_WRITE_URL: postgresql://nexus_writer:writerpass@localhost:5432/personal_ai_core
          NEXUS_BACKEND_KEY: test-integration-key
        run: |
          cd backend
          pytest -m integration -q

      - name: Tear down PostgreSQL
        if: always()
        run: |
          cd backend
          docker compose -f docker-compose.test.yml down -v

  # Real-JDBC parity test: the actual Android pgjdbc + NeonJdbcClient + SecondBrainSql path against
  # the same disposable PostgreSQL the backend integration tests use (JDBC == HTTP proof).
  jdbc-integration:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Start disposable PostgreSQL
        run: |
          cd backend
          docker compose -f docker-compose.test.yml up -d --wait --wait-timeout 120

      - name: Run JDBC parity test
        env:
          NEON_READ_URL: postgresql://nexus_reader:readerpass@localhost:5432/second_brain
          NEON_WRITE_URL: postgresql://nexus_writer:writerpass@localhost:5432/personal_ai_core
        run: ./gradlew test --tests "com.nexus.agent.data.repository.NeonJdbcIntegrationTest" --no-daemon

      - name: Tear down PostgreSQL
        if: always()
        run: |
          cd backend
          docker compose -f docker-compose.test.yml down -v
