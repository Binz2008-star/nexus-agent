name: build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Least-privilege: only repo contents read is needed. The debug APK is uploaded to
# the workflow artifact store (not repo contents), so no id-token/packages/actions:write.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Run unit tests
        run: ./gradlew test --no-daemon

      - name: Decode test signing keystore
        shell: bash
        run: |
          echo "${{ secrets.TEST_SIGNING_KEYSTORE_BASE64 }}" | base64 --decode > "${{ runner.temp }}/nexus-test-signing.p12"

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon
        env:
          GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          TEST_SIGNING_KEYSTORE: ${{ runner.temp }}/nexus-test-signing.p12
          TEST_SIGNING_KEYSTORE_PASSWORD: ${{ secrets.TEST_SIGNING_KEYSTORE_PASSWORD }}
          TEST_SIGNING_KEY_ALIAS: nexustest
          TEST_SIGNING_KEY_PASSWORD: ${{ secrets.TEST_SIGNING_KEYSTORE_PASSWORD }}

      - name: Print APK signing certificate
        shell: bash
        run: |
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -name apksigner 2>/dev/null | sort | tail -1)"
          if [ -n "$APKSIGNER" ]; then
            "$APKSIGNER" verify --print-certs app/build/outputs/apk/debug/app-debug.apk
          else
            echo "apksigner not found; skipping cert print"
          fi

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: nexus-agent-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

  instrumentation-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Enable KVM for emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name=kvm

      - name: Run instrumentation tests on emulator
        uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: default
          script: ./gradlew connectedDebugAndroidTest --no-daemon

      - name: Upload instrumentation test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: instrumentation-test-report
          path: |
            app/build/reports/androidTests/connected/
            app/build/outputs/androidTest-results/connected/
          if-no-files-found: ignore
          retention-days: 14
