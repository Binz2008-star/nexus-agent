[pytest]
pythonpath = .
testpaths = tests
markers =
    integration: requires a disposable PostgreSQL (set NEON_READ_URL / NEON_WRITE_URL / NEXUS_BACKEND_KEY)
    staging: live parity against Neon staging (data-agnostic; set NEON_READ_URL / NEON_WRITE_URL / NEXUS_BACKEND_KEY / NEXUS_STAGING_ADMIN_URL)
